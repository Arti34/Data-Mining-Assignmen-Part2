services:
  api:
    build: .
    command: uvicorn app.api:app --host 0.0.0.0 --port 8000
    ports: ['8000:8000']
    volumes: ['./data:/app/data','./models:/app/models','./artifacts:/app/artifacts']
  dashboard:
    build: .
    command: streamlit run app/dashboard.py --server.address 0.0.0.0 --server.port 8501
    ports: ['8501:8501']
    depends_on: [api]
